<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Phaser test</title></head>
<body style="margin:0;background:#000">
<div id="game"></div>
<script type="module">
import Phaser from 'phaser';
console.log('[test] Phaser loaded:', typeof Phaser);

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: 800, height: 600,
  backgroundColor: '#2244aa',
  scene: {
    create() {
      console.log('[test] scene created');
      this.add.text(400, 300, 'PHASER OK', { fontSize: '48px', color: '#fff' }).setOrigin(0.5);
    }
  }
});
</script>
</body>
</html>
