<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rally TMA</title>

  <!-- Telegram SDK: async — не блокирует парсинг -->
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>

  <!-- Phaser: обычный скрипт, загружается синхронно, но локально -->
  <script src="./phaser.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #game { width: 100vw; height: 100vh; }
    #ui { position: fixed; top: 8px; right: 8px; z-index: 10; }
    button { padding: 8px 12px; font-size: 14px; border-radius: 6px; background: #2a9d8f; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"><button id="btn-regen">🔄 Новый мир</button></div>
  <script>
    // Телеграм может ещё не загрузиться — ждём
    function waitForTelegram(callback) {
      if (window.Telegram && window.Telegram.WebApp) {
        callback(window.Telegram.WebApp);
      } else {
        setTimeout(function() { waitForTelegram(callback); }, 100);
      }
    }

    // Инициализация игры
    var game = new Phaser.Game({
      type: Phaser.CANVAS,
      parent: 'game',
      backgroundColor: '#1a1a1a',
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      physics: {
        default: 'matter',
        matter: { gravity: { x: 0, y: 0 }, debug: false }
      },
      scene: {
        preload: function() {
          // Загружаем текстуры CMR
          this.load.image('gravel',  'assets/cmr/track/gravel1.png');
          this.load.image('gravel2', 'assets/cmr/track/gravel2.png');
          this.load.image('gravel3', 'assets/cmr/track/gravel3.png');
          this.load.image('mud',     'assets/cmr/track/mud1.png');
          this.load.image('rock',    'assets/cmr/track/rock1.png');
          this.load.image('tarmac',  'assets/cmr/track/tarmac1.png');
          this.load.image('grass',   'assets/cmr/track/grass1.png');
          this.load.image('sky',     'assets/cmr/sky/sky_aus.png');
        },
        create: function() {
          var self = this;

          // === ТЕСТ: показываем все текстуры ===
          var keys = ['gravel', 'gravel2', 'gravel3', 'mud', 'rock', 'tarmac', 'grass'];
          var x = 20, y = 60;
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            if (self.textures.exists(k)) {
              self.add.image(x, y, k).setOrigin(0, 0).setScale(0.3);
              self.add.text(x + 4, y + 4, k, { fontSize: '12px', color: '#fff' });
              x += 120;
              if (x > self.scale.width - 100) { x = 20; y += 120; }
            }
          }

          // === МАШИНА ===
          var g = self.add.graphics();
          g.fillStyle(0xff4444);
          g.fillRect(-12, -20, 24, 40);
          g.generateTexture('car', 24, 40);
          g.destroy();

          var car = self.matter.add.sprite(self.scale.width / 2, self.scale.height / 2, 'car');
          car.setFrictionAir(0.02);
          car.setFixedRotation();
          car.setDepth(10);

          self.cameras.main.startFollow(car);
          self.cursors = self.input.keyboard.createCursorKeys();

          // === TELEGRAM ===
          waitForTelegram(function(tg) {
            tg.ready();
            tg.expand();
            console.log('[tg] Telegram OK');

            document.getElementById('btn-regen').addEventListener('click', function() {
              if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
              self.scene.restart();
            });
          });
        },
        update: function() {
          var car = this.matter.world.localWorld.bodies[0].gameObject;
          if (!car || !this.cursors) return;
          var turn = 0.04;
          if (this.cursors.up.isDown) {
            car.setVelocity(
              Math.cos(car.rotation - Math.PI / 2) * 4,
              Math.sin(car.rotation - Math.PI / 2) * 4
            );
          }
          if (this.cursors.left.isDown) car.setAngularVelocity(-turn);
          else if (this.cursors.right.isDown) car.setAngularVelocity(turn);
          else car.setAngularVelocity(0);
        }
      }
    });
  </script>
</body>
</html>
