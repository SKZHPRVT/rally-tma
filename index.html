<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="full-screen" content="yes">
  <title>Rally TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh; height: 100dvh;
      overflow: hidden; background: #87ceeb;
      font-family: 'Courier New', monospace;
      touch-action: none;
      position: fixed;
      inset: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* HUD */
    #timer {
      position: fixed;
      top: 8px; left: 50%;
      transform: translateX(-50%) translateX(-75px);
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 4px 14px;
      color: #fff; font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      font-size: 20px; letter-spacing: 1px;
      min-width: 120px; text-align: center;
      z-index: 100; pointer-events: none;
    }
    
    #speed {
      position: fixed;
      top: 8px; left: 50%;
      transform: translateX(-50%) translateX(75px);
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 4px 14px;
      color: #fff; font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      font-size: 20px;
      min-width: 100px; text-align: center;
      z-index: 100; pointer-events: none;
    }
    
    #speed span {
      font-size: 11px; opacity: 0.7; font-weight: normal;
    }
    
    .btn-control {
      position: fixed;
      pointer-events: auto;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      color: #fff; font-size: 22px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; cursor: pointer;
      touch-action: none;
      transition: transform 0.1s, background 0.15s;
      z-index: 20;
    }
    .btn-control:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.92);
    }
    
    #btn-gas { bottom: 110px; right: 20px; width: 80px; height: 80px; }
    #btn-brake { bottom: 20px; right: 20px; width: 80px; height: 80px; }
    #btn-left { bottom: 60px; left: 20px; width: 80px; height: 80px; }
    #btn-right { bottom: 60px; left: 120px; width: 80px; height: 80px; }
    
    /* === МОДАЛКИ === */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal.show { display: flex; }
    
    .modal-title {
      font-size: 36px;
      color: #FFD24A;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255,210,74,0.8), 3px 3px 6px #000;
      margin-bottom: 12px;
      letter-spacing: 3px;
      text-align: center;
    }
    
    .modal-subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 32px;
      letter-spacing: 2px;
      text-align: center;
    }
    
    .modal-time {
      font-size: 32px;
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    
    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 320px;
    }
    
    .modal-btn {
      padding: 16px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      background: rgba(30,30,30,0.9);
      color: #fff;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      user-select: none;
      touch-action: manipulation;
    }
    .modal-btn:active { transform: scale(0.95); }
    .modal-btn.primary {
      background: rgba(200,30,30,0.85);
      border-color: #ff5555;
    }
    
    /* === COUNTDOWN === */
    #countdown {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      pointer-events: none;
    }
    #countdown.show { display: flex; }
    
    #countdown-number {
      font-size: 180px;
      font-weight: bold;
      color: #FFD24A;
      text-shadow:
        0 0 40px rgba(255,210,74,1),
        0 0 80px rgba(255,140,0,0.8),
        6px 6px 12px #000;
      animation: pulse 1s ease-out;
      font-family: 'Courier New', monospace;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    /* GO! */
    #countdown-number.go {
      color: #44ff44;
      text-shadow:
        0 0 40px rgba(68,255,68,1),
        0 0 80px rgba(0,200,0,0.8),
        6px 6px 12px #000;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <div id="timer">00:00.00</div>
  <div id="speed">0 <span>km/h</span></div>
  
  <div id="btn-gas" class="btn-control">▲</div>
  <div id="btn-brake" class="btn-control">▼</div>
  <div id="btn-left" class="btn-control">◀</div>
  <div id="btn-right" class="btn-control">▶</div>
  
  <!-- СТАРТОВОЕ МЕНЮ -->
  <div id="start-modal" class="modal show">
    <div class="modal-title">RALLY TMA</div>
    <div class="modal-subtitle">Выбери режим</div>
    <div class="modal-buttons">
      <button class="modal-btn primary" id="btn-start-race">🏁 Круг</button>
      <button class="modal-btn" id="btn-start-free">🌍 Свободная езда</button>
    </div>
  </div>
  
  <!-- ФИНИШ -->
  <div id="finish-modal" class="modal">
    <div class="modal-title">ФИНИШ</div>
    <div class="modal-time" id="finish-time">00:00.00</div>
    <div class="modal-buttons">
      <button class="modal-btn primary" id="btn-retry">🔄 Заново</button>
      <button class="modal-btn" id="btn-new-world">🌍 Новая карта</button>
    </div>
  </div>
  
  <!-- ОТСЧЁТ -->
  <div id="countdown">
    <div id="countdown-number">3</div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
