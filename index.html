<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="full-screen" content="yes">
  <title>Rally TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh; height: 100dvh;
      overflow: hidden; background: #87ceeb;
      font-family: 'Courier New', monospace;
      touch-action: none;
      position: fixed;
      inset: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* HUD — таймер и скорость */
    #timer {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) translateX(-75px);
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 4px 14px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      font-size: 20px;
      letter-spacing: 1px;
      min-width: 120px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }
    
    #speed {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) translateX(75px);
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 4px 14px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      font-size: 20px;
      min-width: 100px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }
    
    #speed span {
      font-size: 11px;
      opacity: 0.7;
      font-weight: normal;
    }
    
    .btn-control {
      position: fixed;
      pointer-events: auto;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.1s, background 0.15s;
      z-index: 20;
    }
    
    .btn-control:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.92);
    }
    
    #btn-gas { bottom: 110px; right: 20px; width: 80px; height: 80px; }
    #btn-brake { bottom: 20px; right: 20px; width: 80px; height: 80px; }
    #btn-left { bottom: 60px; left: 20px; width: 80px; height: 80px; }
    #btn-right { bottom: 60px; left: 120px; width: 80px; height: 80px; }
    
    /* Модалка финиша */
    #finish-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    
    #finish-modal.show {
      display: flex;
    }
    
    #finish-title {
      font-size: 48px;
      color: #FFD24A;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255,210,74,0.8), 3px 3px 6px #000;
      margin-bottom: 12px;
      letter-spacing: 3px;
    }
    
    #finish-time {
      font-size: 32px;
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    
    #finish-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 320px;
    }
    
    .finish-btn {
      padding: 16px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      background: rgba(30,30,30,0.9);
      color: #fff;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      user-select: none;
      touch-action: manipulation;
    }
    
    .finish-btn:active {
      transform: scale(0.95);
    }
    
    .finish-btn.primary {
      background: rgba(200,30,30,0.85);
      border-color: #ff5555;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <div id="timer">00:00.00</div>
  <div id="speed">0 <span>km/h</span></div>
  
  <div id="btn-gas" class="btn-control">▲</div>
  <div id="btn-brake" class="btn-control">▼</div>
  <div id="btn-left" class="btn-control">◀</div>
  <div id="btn-right" class="btn-control">▶</div>
  
  <div id="finish-modal">
    <div id="finish-title">ФИНИШ</div>
    <div id="finish-time">00:00.00</div>
    <div id="finish-buttons">
      <button class="finish-btn primary" id="btn-retry">🔄 Заново</button>
      <button class="finish-btn" id="btn-new-world">🌍 Новый мир</button>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
