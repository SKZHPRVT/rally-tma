<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="full-screen" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Rally</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    /* === ШРИФТЫ === */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('./fonts/inter-600-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('./fonts/inter-600-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('./fonts/inter-700-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('./fonts/inter-700-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('./fonts/inter-800-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('./fonts/inter-800-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215;
    }
    
    /* === БАЗА === */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      color: #fff;
      position: fixed;
      inset: 0;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }
    
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    
    /* ============ HUD (по центру сверху) ============ */
    #hud-top {
      position: fixed;
      top: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 100;
      pointer-events: none;
    }
    
    #timer-display {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.6);
    }
    
    #speed-display {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      letter-spacing: 0.5px;
      color: #ff3b30;
      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(255, 59, 48, 0.5);
    }
    
    #speed-display .unit {
      font-size: 12px;
      font-weight: 700;
      opacity: 0.7;
      margin-left: 4px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* ============ КНОПКА МЕНЮ ============ */
    #btn-menu {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    #btn-menu.show { display: flex; }
    #btn-menu:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* ============ КНОПКИ УПРАВЛЕНИЯ ============ */
    .btn-control {
      position: fixed;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      z-index: 20;
      box-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.25),
        0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.15s;
    }
    
    .btn-control:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }
    
    .btn-control svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      opacity: 0.9;
    }
    
    #btn-gas {
      bottom: 100px;
      right: 20px;
      width: 76px;
      height: 76px;
    }
    #btn-brake {
      bottom: 20px;
      right: 20px;
      width: 76px;
      height: 76px;
    }
    #btn-left {
      bottom: 56px;
      left: 20px;
      width: 76px;
      height: 76px;
    }
    #btn-right {
      bottom: 56px;
      left: 112px;
      width: 76px;
      height: 76px;
    }
    
    /* ============ BOTTOM SHEET ============ */
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      pointer-events: none;
    }
    .sheet.show { display: block; }
    
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: auto;
      animation: fadeIn 0.25s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .sheet-panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 16px 18px;
      border-radius: 28px;
      background: rgba(30, 30, 35, 0.72);
      backdrop-filter: blur(50px) saturate(200%);
      -webkit-backdrop-filter: blur(50px) saturate(200%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 20px 60px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      animation: sheetUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 85vh;
      overflow-y: auto;
    }
    
    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .sheet-handle {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.25);
      margin: 0 auto 12px;
    }
    
    .sheet-header {
      text-align: center;
      margin-bottom: 14px;
    }
    
    .sheet-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.15;
    }
    
    .sheet-subtitle {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.55;
      margin-top: 2px;
    }
    
    .sheet-time {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      letter-spacing: -1px;
      text-align: center;
      margin: 4px 0 16px;
      background: linear-gradient(180deg, #fff, #a8b0bd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sheet-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .action-btn {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    
    .action-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }
    
    .action-btn.primary {
      background: rgba(10, 132, 255, 0.85);
      border-color: rgba(10, 132, 255, 1);
      box-shadow: 0 4px 16px rgba(10, 132, 255, 0.4);
    }
    
    .action-btn.primary:active {
      background: rgba(10, 132, 255, 1);
    }
    
    .action-btn .btn-icon {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.9;
    }
    
    .action-btn .btn-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .action-btn .btn-label {
      flex: 1;
    }
    
    /* ============ COUNTDOWN ============ */
    #countdown {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      pointer-events: none;
    }
    #countdown.show { display: flex; }
    
    #countdown-number {
      font-size: 180px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -8px;
      text-shadow:
        0 0 100px rgba(255, 255, 255, 0.5),
        0 0 30px rgba(10, 132, 255, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.8);
      animation: countdownPulse 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes countdownPulse {
      0% { transform: scale(0.4); opacity: 0; filter: blur(20px); }
      50% { transform: scale(1.05); opacity: 1; filter: blur(0); }
      100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    
    #countdown-number.go {
      color: #30d158;
      text-shadow:
        0 0 100px rgba(48, 209, 88, 0.8),
        0 0 30px rgba(48, 209, 88, 1),
        0 8px 24px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <div id="hud-top">
    <div id="timer-display">00:00.00</div>
    <div id="speed-display">0<span class="unit">km/h</span></div>
  </div>
  
  <div id="btn-menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </div>
  
  <div id="btn-gas" class="btn-control">
    <svg viewBox="0 0 24 24"><path d="M12 4l8 14H4z"/></svg>
  </div>
  <div id="btn-brake" class="btn-control">
    <svg viewBox="0 0 24 24"><path d="M12 20l-8-14h16z"/></svg>
  </div>
  <div id="btn-left" class="btn-control">
    <svg viewBox="0 0 24 24"><path d="M4 12l14-8v16z"/></svg>
  </div>
  <div id="btn-right" class="btn-control">
    <svg viewBox="0 0 24 24"><path d="M20 12l-14 8V4z"/></svg>
  </div>
  
  <div id="start-modal" class="sheet show">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Rally</div>
        <div class="sheet-subtitle">Telegram Mini App</div>
      </div>
      <div class="sheet-actions">
        <button class="action-btn primary" id="btn-start-race">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h14l-3 4 3 4H5"/></svg>
          </span>
          <span class="btn-label">Начать круг</span>
        </button>
        <button class="action-btn" id="btn-start-free">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          </span>
          <span class="btn-label">Свободная езда</span>
        </button>
      </div>
    </div>
  </div>
  
  <div id="arch-modal" class="sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Старт</div>
        <div class="sheet-subtitle">Ты у арки</div>
      </div>
      <div class="sheet-actions">
        <button class="action-btn primary" id="btn-arch-race">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h14l-3 4 3 4H5"/></svg>
          </span>
          <span class="btn-label">Начать круг</span>
        </button>
        <button class="action-btn" id="btn-arch-newtrack">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="btn-label">Сгенерировать трассу</span>
        </button>
        <button class="action-btn" id="btn-arch-close">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>
          </span>
          <span class="btn-label">Продолжить езду</span>
        </button>
      </div>
    </div>
  </div>
  
  <div id="finish-modal" class="sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Финиш</div>
        <div class="sheet-subtitle">Твой результат</div>
      </div>
      <div class="sheet-time" id="finish-time">00:00.00</div>
      <div class="sheet-actions">
        <button class="action-btn primary" id="btn-retry">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3 6.3"/><path d="M4 20v-5h5"/></svg>
          </span>
          <span class="btn-label">Заново</span>
        </button>
        <button class="action-btn" id="btn-new-world">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="4"/></svg>
          </span>
          <span class="btn-label">Новая карта</span>
        </button>
      </div>
    </div>
  </div>
  
  <div id="countdown">
    <div id="countdown-number">3</div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
