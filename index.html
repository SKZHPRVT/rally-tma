<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rally TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
    #game { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    #timer {
      position: absolute; top: 20px; left: 20px;
      font-size: 32px; font-weight: bold;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px; border-radius: 8px;
    }
    #speed {
      position: absolute; bottom: 20px; right: 20px;
      font-size: 48px; font-weight: bold;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px; border-radius: 8px;
    }
    #speed span { font-size: 20px; opacity: 0.7; }
    .btn-control {
      position: fixed; pointer-events: auto;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%; color: #fff;
      font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; cursor: pointer;
    }
    .btn-control:active { background: rgba(255,255,255,0.3); }
    #btn-gas { bottom: 100px; right: 30px; width: 80px; height: 80px; }
    #btn-brake { bottom: 20px; right: 30px; width: 80px; height: 80px; }
    #btn-left { bottom: 60px; left: 30px; width: 80px; height: 80px; }
    #btn-right { bottom: 60px; left: 130px; width: 80px; height: 80px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="timer">00:00.00</div>
    <div id="speed">0 <span>km/h</span></div>
  </div>
  <div id="btn-gas" class="btn-control">▲</div>
  <div id="btn-brake" class="btn-control">▼</div>
  <div id="btn-left" class="btn-control">◀</div>
  <div id="btn-right" class="btn-control">▶</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
