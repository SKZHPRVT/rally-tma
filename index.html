<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="full-screen" content="yes">
  <title>Rally TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh; height: 100dvh;
      overflow: hidden; background: #87ceeb;
      font-family: 'Courier New', monospace;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    #top-hud {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 80px);
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      pointer-events: none;
      z-index: 10;
    }
    
    .hud-panel {
      background: rgba(0,0,0,0.65);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 4px 14px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
    }
    
    #timer {
      font-size: 20px;
      letter-spacing: 1px;
      min-width: 120px;
      text-align: center;
    }
    
    #speed {
      font-size: 20px;
      min-width: 100px;
      text-align: center;
    }
    
    #speed span {
      font-size: 11px;
      opacity: 0.7;
      font-weight: normal;
    }
    
    .btn-control {
      position: fixed;
      pointer-events: auto;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.1s, background 0.15s;
      z-index: 20;
    }
    
    .btn-control:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.92);
    }
    
    #btn-gas { bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); right: 20px; width: 80px; height: 80px; }
    #btn-brake { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); right: 20px; width: 80px; height: 80px; }
    #btn-left { bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); left: 20px; width: 80px; height: 80px; }
    #btn-right { bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); left: 120px; width: 80px; height: 80px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <div id="top-hud">
    <div id="timer" class="hud-panel">00:00.00</div>
    <div id="speed" class="hud-panel">0 <span>km/h</span></div>
  </div>
  
  <div id="btn-gas" class="btn-control">▲</div>
  <div id="btn-brake" class="btn-control">▼</div>
  <div id="btn-left" class="btn-control">◀</div>
  <div id="btn-right" class="btn-control">▶</div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
