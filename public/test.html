<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test</title></head>
<body style="margin:0;background:#111;color:#fff;font-family:sans-serif">
<div id="game"></div>
<script type="module">
import Phaser from 'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.js';
console.log('[test] Phaser:', typeof Phaser);
new Phaser.Game({
  type: Phaser.CANVAS,
  parent: 'game',
  width: 800, height: 600,
  backgroundColor: '#2244aa',
  scene: {
    create() {
      this.add.text(400, 300, 'CDN PHASER OK', { fontSize: '48px', color: '#fff' }).setOrigin(0.5);
    }
  }
});
</script>
</body></html>
